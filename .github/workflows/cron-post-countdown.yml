name: cron / post-countdown

# Sunday 23:00 UTC countdown social post — "the pit closes Monday at midnight EST."
# Runs same minute as cron-email-countdown; the two are independent and minor
# drift between them is fine. Route auth-gated by Bearer CRON_SECRET.

on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch: {}

concurrency:
  group: cron-post-countdown
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger post-countdown
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing SITE_URL or CRON_SECRET repo secret." >&2
            exit 1
          fi
          curl --fail-with-body \
               --silent --show-error \
               --max-time 60 \
               -H "Authorization: Bearer $CRON_SECRET" \
               -X GET \
               "$SITE_URL/api/cron/post-countdown"
