name: cron / post-leader

# Daily 17:00 UTC current-leader social post — surfaces who's winning the
# in-progress week to keep the contest visible.
# Route auth-gated by Bearer CRON_SECRET.

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-post-leader
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger post-leader
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing SITE_URL or CRON_SECRET repo secret." >&2
            exit 1
          fi
          curl --fail-with-body \
               --silent --show-error \
               --max-time 60 \
               -H "Authorization: Bearer $CRON_SECRET" \
               -X GET \
               "$SITE_URL/api/cron/post-leader"
