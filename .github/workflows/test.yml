name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build + type-check (Next.js)
    runs-on: ubuntu-latest
    # `next build` runs the TypeScript compiler and renders the static parts
    # of every route. Module-load code in the Supabase + Sentry SDKs throws
    # if these env vars are missing, so we set stubs — the build doesn't
    # hit the network or the DB.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-stub-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-stub-service-role-key
      ANTHROPIC_API_KEY: ci-stub-anthropic-key
      ADMIN_PASSWORD: ci-stub-admin-password
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E smoke tests (Playwright)
    runs-on: ubuntu-latest
    # Stub env vars — real values aren't needed for the smoke tests, but the
    # Supabase + Sentry SDKs throw at module-load time if these are missing.
    # The smoke specs only verify page rendering and 404 behavior, no DB or
    # auth, so the values can be sentinel strings.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-stub-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-stub-service-role-key
      ANTHROPIC_API_KEY: ci-stub-anthropic-key
      ADMIN_PASSWORD: ci-stub-admin-password
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
