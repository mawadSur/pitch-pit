name: cron / post-winner

# Tuesday 13:00 UTC winner announcement social post — fires after the week
# has been closed by close-week-and-build earlier that morning.
# Route auth-gated by Bearer CRON_SECRET.

on:
  schedule:
    - cron: "0 13 * * 2"
  workflow_dispatch: {}

concurrency:
  group: cron-post-winner
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger post-winner
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing SITE_URL or CRON_SECRET repo secret." >&2
            exit 1
          fi
          curl --fail-with-body \
               --silent --show-error \
               --max-time 60 \
               -H "Authorization: Bearer $CRON_SECRET" \
               -X GET \
               "$SITE_URL/api/cron/post-winner"
