name: cron / email-countdown

# Sunday 23:00 UTC countdown email to subscribers — "the pit closes tomorrow."
# Route auth-gated by Bearer CRON_SECRET.

on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch: {}

concurrency:
  group: cron-email-countdown
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger email-countdown
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing SITE_URL or CRON_SECRET repo secret." >&2
            exit 1
          fi
          curl --fail-with-body \
               --silent --show-error \
               --max-time 120 \
               -H "Authorization: Bearer $CRON_SECRET" \
               -X GET \
               "$SITE_URL/api/cron/email-countdown"
