name: cron / close-week-and-build

# Weekly pit close: locks the week's submissions, picks the winner, writes
# Supabase rows, sends the result email, and fires the build repository_dispatch.
# Runs Tuesday 05:05 UTC (Mon midnight EST). Route auth-gated by Bearer CRON_SECRET.

on:
  schedule:
    - cron: "5 5 * * 2"
  workflow_dispatch: {}

concurrency:
  group: cron-close-week-and-build
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger close-week-and-build
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing SITE_URL or CRON_SECRET repo secret." >&2
            exit 1
          fi
          curl --fail-with-body \
               --silent --show-error \
               --max-time 300 \
               -H "Authorization: Bearer $CRON_SECRET" \
               -X GET \
               "$SITE_URL/api/cron/close-week-and-build"
