name: cron / alert-silence

# Every 6 hours: check cron_heartbeats and fire a Sentry warning for any
# job whose last_run_at is older than 2 * expected_interval + 1h grace.
# This is the "the cron stopped working" alert — distinct from "the cron
# stopped firing" (which GH Actions itself surfaces).
# Route auth-gated by Bearer CRON_SECRET.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-alert-silence
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger alert-silence
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing SITE_URL or CRON_SECRET repo secret." >&2
            exit 1
          fi
          curl --fail-with-body \
               --silent --show-error \
               --max-time 60 \
               -H "Authorization: Bearer $CRON_SECRET" \
               -X GET \
               "$SITE_URL/api/cron/alert-silence"
